<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Инструкции по оборудованию</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#1d6fe0;--acx:#fff;--bd:#e3e6eb;--wr:#fff4e0;--wrt:#8a5300;--rd:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eef0f3;--mut:#9aa4b2;--ac:#5b9bff;--acx:#0b1220;--bd:#2c333b;--wr:#3a2c10;--wrt:#ffcf7a;--rd:#ff6b5e}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eef0f3;--mut:#9aa4b2;--ac:#5b9bff;--acx:#0b1220;--bd:#2c333b;--wr:#3a2c10;--wrt:#ffcf7a;--rd:#ff6b5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:17px;margin:18px 0 8px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--acx);cursor:pointer}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
a{color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--tx)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.card b{display:block;font-size:17px}
.eq{color:var(--mut);font-size:14px}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.step>div:last-child{min-width:0;overflow-wrap:anywhere}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;font-weight:700}
.warn{background:var(--wr);color:var(--wrt);border-radius:12px;padding:12px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.badge{font-size:12px;color:var(--mut)}
.body p{margin:10px 0;overflow-wrap:anywhere}
.body ul{padding-left:22px}
.body h1,.body h3{font-size:17px;margin:18px 0 8px}
.body table{border-collapse:collapse;display:block;overflow-x:auto;margin:10px 0}
.body td,.body th{border:1px solid var(--bd);padding:6px 10px}
.body img{max-width:100%;max-height:360px;border-radius:10px;border:1px solid var(--bd);cursor:pointer;display:block;margin:10px 0}
.body code{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:1px 5px}
.help{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.help pre{white-space:pre-wrap;margin:8px 0 0;font:14px/1.4 ui-monospace,Consolas,monospace}
.big{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:8px}
.big img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var host=location.hostname,seg=location.pathname.split('/')[1]||'';
var OWNER=/\.github\.io$/.test(host)?host.split('.')[0]:'e696vo-alt';
var REPO=(/\.github\.io$/.test(host)&&seg)?seg:'instrukcii';
var DIR='instructions/',KEY='instr_files_v2';
var app=document.getElementById('app'),items=[],q='',cat='Все',cur=null,state='loading';

function h(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==='on'){for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev])}else if(k==='text')e.textContent=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function enc(p){return p.split('/').map(encodeURIComponent).join('/')}
function big(src){var o=h('div',{class:'big',on:{click:function(){o.remove()}}},[h('img',{src:src})]);document.body.appendChild(o)}

/* --- мини-разбор markdown --- */
function inline(s){
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(m,a,u){
    var src=/^https?:\/\//i.test(u)?u:DIR+encodeURI(decodeURI(u).replace(/^\.?\//,''));
    return '<img src="'+src+'" alt="'+a+'">'});
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
}
function renderBody(lines){
  var out='',para=[],ul=[],n=0;
  function fp(){if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}}
  function fu(){if(ul.length){out+='<ul>'+ul.map(function(x){return '<li>'+inline(x)+'</li>'}).join('')+'</ul>';ul=[]}}
  lines.forEach(function(raw){
    var l=raw.trim(),m;
    if(!l){fp();fu();return}
    if(m=l.match(/^#{1,6}\s+(.*)/)){fp();fu();out+='<h2>'+inline(m[1])+'</h2>';return}
    if(m=l.match(/^\d+[.)]\s+(.*)/)){fp();fu();n++;out+='<div class="step"><div class="num">'+n+'</div><div>'+inline(m[1])+'</div></div>';return}
    if(m=l.match(/^[-*•]\s+(.*)/)){fp();ul.push(m[1]);return}
    if(m=l.match(/^>\s?(.*)/)){fp();fu();var t=m[1].replace(/^\[!\w+\]\s*/,'');if(t)out+='<div class="warn">⚠️ '+inline(t)+'</div>';return}
    fu();para.push(l);
  });
  fp();fu();
  return {html:out,steps:n};
}
function parse(txt,path){
  var lines=txt.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n');
  var name=path.replace(/^.*\//,'').replace(/\.md$/i,'');
  var title='',equip='',warn='',i=0,m;
  for(;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l)continue;
    if(!title&&(m=l.match(/^#\s+(.*)/))){title=m[1];continue}
    if(m=l.match(/^(оборудование)\s*:\s*(.*)/i)){equip=m[2].trim();continue}
    if(m=l.match(/^(внимание|предупреждение)\s*:\s*(.*)/i)){warn=m[2].trim();continue}
    break;
  }
  var r=renderBody(lines.slice(i));
  var plain=lines.join(' ').toLowerCase();
  return {path:path,title:title||name,equip:equip||'Прочее',warn:warn,html:r.html,steps:r.steps,search:(title+' '+equip+' '+plain).toLowerCase()};
}


/* --- Word (.docx) --- */
var mmP=null;
function ensureMammoth(){
  if(window.mammoth)return Promise.resolve();
  if(mmP)return mmP;
  function add(u){return new Promise(function(ok,no){var sc=document.createElement('script');sc.src=u;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
  mmP=add('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js').catch(function(){return add('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js')});
  return mmP;
}
function clean(root){
  root.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(function(e){e.remove()});
  root.querySelectorAll('*').forEach(function(e){
    Array.from(e.attributes).forEach(function(a){
      var n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
      if(n.indexOf('on')===0||n==='style'||n==='class')e.removeAttribute(a.name);
      else if(n==='href'&&!/^(https?:|mailto:|#)/.test(v))e.removeAttribute(a.name);
      else if(n==='src'&&!/^(data:image\/|https?:)/.test(v))e.removeAttribute(a.name);
    });
    if(e.tagName==='A'){e.setAttribute('target','_blank');e.setAttribute('rel','noopener')}
  });
}
async function parseDocx(buf,path){
  await ensureMammoth();
  var r=await mammoth.convertToHtml({arrayBuffer:buf});
  var doc=new DOMParser().parseFromString('<body>'+r.value+'</body>','text/html');
  var root=doc.body;clean(root);
  var name=path.replace(/^.*\//,'').replace(/\.docx$/i,'');
  var title='',equip='',warn='',m;
  Array.from(root.children).forEach(function(p){
    if(p.tagName!=='P')return;
    var t=p.textContent.trim();
    if(m=t.match(/^(оборудование)\s*:\s*(.*)/i)){if(!equip)equip=m[2].trim();p.remove()}
    else if(m=t.match(/^(внимание|предупреждение)\s*:\s*(.*)/i)){if(!warn)warn=m[2].trim();p.remove()}
  });
  var kids=Array.from(root.children).filter(function(e){return e.textContent.trim()||e.querySelector('img')});
  var f=kids[0];
  if(f&&(/^H[1-6]$/.test(f.tagName)||(f.tagName==='P'&&f.textContent.trim().length<=100&&!/^\d+[.)]\s/.test(f.textContent.trim())&&!f.querySelector('img')))){title=f.textContent.trim();f.remove()}
  var n=0,out=doc.createElement('div');
  function step(html){n++;var s=doc.createElement('div');s.className='step';var nm=doc.createElement('div');nm.className='num';nm.textContent=n;var c=doc.createElement('div');c.innerHTML=html;s.appendChild(nm);s.appendChild(c);out.appendChild(s)}
  Array.from(root.children).forEach(function(e){
    if(e.tagName==='OL'){Array.from(e.children).forEach(function(li){if(li.tagName==='LI')step(li.innerHTML)})}
    else if(e.tagName==='P'&&/^\d+[.)]\s+/.test(e.textContent.trim())){step(e.innerHTML.replace(/^\s*\d+[.)]\s+/,''))}
    else if(e.tagName==='P'&&!e.textContent.trim()&&!e.querySelector('img')){}
    else out.appendChild(e);
  });
  var plain=out.textContent;
  return {path:path,title:title||name,equip:equip||'Прочее',warn:warn,html:out.innerHTML,steps:n,search:(title+' '+equip+' '+plain).toLowerCase()};
}

/* --- загрузка списка файлов из GitHub --- */
async function listFiles(){
  try{
    var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/HEAD?recursive=1');
    if(!r.ok)throw new Error(r.status);
    var j=await r.json();
    var f=j.tree.filter(function(x){return x.type==='blob'&&/^instructions\/[^\/]+\.(md|docx)$/i.test(x.path)&&!/^(_|~|readme)/i.test(x.path.slice(DIR.length))}).map(function(x){return x.path});
    try{localStorage.setItem(KEY,JSON.stringify(f))}catch(e){}
    return f;
  }catch(e){
    try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}
  }
}
async function load(){
  state='loading';route();
  var files=await listFiles();
  if(!files){state='error';route();return}
  var res=await Promise.all(files.map(function(p){
    var isDocx=/\.docx$/i.test(p);
    return fetch(enc(p),{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return isDocx?r.arrayBuffer():r.text()}).then(function(t){return isDocx?parseDocx(t,p):parse(t,p)}).catch(function(){return null})}));
  items=res.filter(Boolean);
  state='ok';
  route();
}

/* --- экраны --- */
function cats(){var s={};items.forEach(function(i){s[i.equip]=1});return ['Все'].concat(Object.keys(s).sort())}
function list(){
  app.innerHTML='';
  app.appendChild(h('h1',{text:'🔧 Инструкции'}));
  if(state==='loading'){app.appendChild(h('div',{class:'empty',text:'Загрузка…'}));return}
  if(state==='error'){app.appendChild(h('div',{class:'empty',text:'Не удалось загрузить список инструкций. Проверьте интернет и обновите страницу.'}));return}
  app.appendChild(h('input',{type:'search',placeholder:'Поиск: оборудование или проблема',value:q,on:{input:function(e){q=e.target.value;renderCards()}}}));
  var chips=h('div',{class:'chips'});
  cats().forEach(function(c){chips.appendChild(h('button',{class:'chip'+(c===cat?' on':''),text:c,on:{click:function(){cat=c;list()}}}))});
  app.appendChild(chips);
  app.appendChild(h('div',{id:'cards'}));
  renderCards();
}
function renderCards(){
  var box=document.getElementById('cards');box.innerHTML='';
  var qq=q.trim().toLowerCase();
  var r=items.filter(function(i){return (cat==='Все'||i.equip===cat)&&(!qq||i.search.indexOf(qq)>-1)});
  if(!r.length){box.appendChild(h('div',{class:'empty',text:items.length?'Ничего не найдено':'Инструкций пока нет'}));return}
  r.sort(function(a,b){return a.equip.localeCompare(b.equip,'ru')||a.title.localeCompare(b.title,'ru')});
  r.forEach(function(i){box.appendChild(h('div',{class:'card',on:{click:function(){cur=i;show()}}},[h('div',{class:'eq',text:i.equip}),h('b',{text:i.title}),h('span',{class:'badge',text:i.steps?i.steps+' шагов':'описание'})]))});
}
function show(){
  app.innerHTML='';
  app.appendChild(h('button',{class:'g',text:'← Назад',on:{click:list}}));
  app.appendChild(h('div',{class:'eq',text:cur.equip,style:'margin-top:14px'}));
  app.appendChild(h('h1',{text:cur.title}));
  if(cur.warn)app.appendChild(h('div',{class:'warn',text:'⚠️ '+cur.warn}));
  var b=h('div',{class:'body',html:cur.html});
  b.querySelectorAll('img').forEach(function(im){im.addEventListener('click',function(){big(im.src)})});
  app.appendChild(b);
  window.scrollTo(0,0);
}
function help(){
  app.innerHTML='';
  app.appendChild(h('button',{class:'g',text:'← К инструкциям',on:{click:function(){location.hash='';}}}));
  app.appendChild(h('h1',{text:'Как добавить инструкцию',style:'margin-top:14px'}));
  app.appendChild(h('div',{class:'help',html:'1. Напишите инструкцию в Word (сохраните как <code>.docx</code>) или в Блокноте (<code>.md</code>, UTF-8).<br>2. Откройте <a target="_blank" rel="noopener" href="https://github.com/'+OWNER+'/'+REPO+'/upload/main/instructions">страницу загрузки</a>, перетащите файл (и фото), нажмите <b>Commit changes</b>.<br>3. Через 1–2 минуты инструкция появится здесь.'}));
  app.appendChild(h('div',{class:'help'},[h('b',{text:'Как оформить текст'}),h('pre',{text:'В Word и в Блокноте одинаково:\nПервая строка — название\nОборудование: Принтер этикеток\nВнимание: Выключите питание\nДальше текст, нумерованный список, фото.\n\nВ Блокноте (.md) название пишут так:\n# Название проблемы\nОборудование: Принтер этикеток\nВнимание: Выключите питание\n\nОписание обычным текстом.\n\n1. Первый шаг\n2. Второй шаг\n\n![](фото.jpg)'})]));
}
function route(){if(location.hash==='#admin')help();else list()}
window.addEventListener('hashchange',route);
if(location.hash==='#admin')help();
load();
})();
</script>
</body>
</html>
